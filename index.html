<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HuBI - Trợ lý FAQ hỗ trợ giải đáp câu hỏi thường gặp" />
  <meta name="theme-color" content="#1f6feb" />
  <title>HuBI | Trợ lý hỗ trợ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="chat-card" aria-label="Khung trò chuyện với HuBI">
      <header class="chat-header">
        <div class="bot-avatar" aria-hidden="true">
          <span class="bot-face">◉‿◉</span>
        </div>

        <div class="bot-info">
          <h1 id="botDisplayName">HuBI</h1>
          <p><span class="status-dot"></span>Trợ lý hỗ trợ thông tin</p>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite" aria-label="Nội dung trò chuyện"></div>

      <div id="suggestions" class="suggestions" aria-label="Câu hỏi gợi ý"></div>

      <form id="chatForm" class="chat-form">
        <label class="sr-only" for="questionInput">Nhập câu hỏi</label>
        <input
          id="questionInput"
          name="question"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="Nhập câu hỏi của bạn..."
          required
        />
        <button type="submit" aria-label="Gửi câu hỏi">Gửi</button>
      </form>

      <p class="note">
        Câu hỏi chưa có đáp án sẽ được HuBI ghi nhận để bổ sung dữ liệu FAQ.
      </p>
    </section>
  </main>

  <script src="faq-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
